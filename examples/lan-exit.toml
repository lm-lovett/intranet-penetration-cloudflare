# Home / office gateway: joins the Workers center node and exports a LAN
# subnet so remote clients can reach 192.168.1.0/24.
#
#   sudo easytier-core -c lan-exit.toml
#
# EasyTier 2.6.x needs a [secure_mode] table. `secure_mode = true` is invalid.
# Replace the example keys with `cd cloudflare && pnpm run keys`.

instance_name = "lan-exit"
hostname = "home-gateway"
dhcp = true
listeners = [
  "tcp://0.0.0.0:11010",
  "udp://0.0.0.0:11010",
]

[network_identity]
network_name = "office"
network_secret = "change-me-to-a-long-random-secret"

[[peer]]
uri = "wss://easytier-center.example.workers.dev:443/"

[[proxy_network]]
cidr = "192.168.1.0/24"

[secure_mode]
enabled = true
local_private_key = "YAdkA9XEmSFvl9V1UNAiJVkzWht89tLVj9G3Bq+upHs="
local_public_key = "K8ntGZQhE6n9IlyJ95DardlhqFOI9D3Hs2OSTz3taBg="

[flags]
enable_encryption = true
multi_thread = true
enable_kcp_proxy = true
