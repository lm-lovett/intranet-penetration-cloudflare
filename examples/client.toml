# Remote client: laptop / phone / office PC connecting to the
# Cloudflare Workers center node.
#   easytier-core -c client.toml

instance_name = "client"
hostname = "laptop"
dhcp = true
secure_mode = true
listeners = [
  "tcp://0.0.0.0:11010",
  "udp://0.0.0.0:11010",
]

[network_identity]
network_name = "office"
network_secret = "change-me-to-a-long-random-secret"

[[peer]]
uri = "wss://easytier-center.example.workers.dev/"

[flags]
enable_encryption = true
multi_thread = true
